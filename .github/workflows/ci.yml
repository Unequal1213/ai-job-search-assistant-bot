name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: workflow_test
          POSTGRES_USER: workflow_test
          POSTGRES_PASSWORD: synthetic_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflow_test -d workflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: >-
        postgresql+asyncpg://workflow_test:synthetic_test_only@localhost:5432/workflow_test
      TEST_DATABASE_URL: >-
        postgresql+asyncpg://workflow_test:synthetic_test_only@localhost:5432/workflow_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check locked environment
        run: python -m pip check

      - name: Run Ruff
        run: python -m ruff check .

      - name: Apply fresh migration
        run: python -m alembic upgrade head

      - name: Check migration drift
        run: python -m alembic check

      - name: Run full test suite
        run: python -m pytest

      - name: Audit production dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Scan current tree for secret patterns
        run: python scripts/secret_scan.py

      - name: Validate Docker Compose
        env:
          BOT_TOKEN: ""
          POSTGRES_DB: workflow_local
          POSTGRES_USER: workflow_local
          POSTGRES_PASSWORD: synthetic_config_only
        run: docker compose --env-file /dev/null config --quiet

      - name: Build runtime image
        run: docker build --tag job-search-workflow:test .

      - name: Assert non-root runtime user
        run: >-
          test "$(docker image inspect --format '{{.Config.User}}'
          job-search-workflow:test)" = "10001:10001"

      - name: Run offline container configuration smoke
        run: >-
          docker run --rm
          --env DATABASE_URL=postgresql+asyncpg://placeholder:placeholder@db:5432/placeholder
          --entrypoint python job-search-workflow:test -m app.config_check

      - name: Assert no environment file in image
        run: >-
          docker run --rm --entrypoint sh job-search-workflow:test
          -c 'test ! -e /app/.env'
