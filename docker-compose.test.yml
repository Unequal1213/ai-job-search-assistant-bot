services:
  postgres-test:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: workflow_test
      POSTGRES_USER: workflow_test
      POSTGRES_PASSWORD: synthetic_test_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow_test -d workflow_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
